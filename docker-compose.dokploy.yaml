version: '3'

x-base-config: &base-config
  build:
    context: .
    dockerfile: ./docker/Dockerfile
    args:
      BUNDLE_WITHOUT: 'development:test'
      EXECJS_RUNTIME: 'Disabled'
      RAILS_ENV: 'production'
      RAILS_SERVE_STATIC_FILES: 'true'
  volumes:
    - chatwoot-storage:/app/storage
  networks:
    - dokploy-network
  environment:
    - FRONTEND_URL=${FRONTEND_URL}
    - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    - RAILS_ENV=${RAILS_ENV:-production}
    - NODE_ENV=${NODE_ENV:-production}
    - INSTALLATION_ENV=${INSTALLATION_ENV:-docker}
    - RAILS_LOG_TO_STDOUT=${RAILS_LOG_TO_STDOUT:-true}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - DEFAULT_LOCALE=${DEFAULT_LOCALE:-en}
    - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
    - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    - POSTGRES_DATABASE=${POSTGRES_DATABASE:-chatwoot_production}
    - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-5}
    - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL}
    - SMTP_ADDRESS=${SMTP_ADDRESS}
    - SMTP_PORT=${SMTP_PORT}
    - SMTP_USERNAME=${SMTP_USERNAME}
    - SMTP_PASSWORD=${SMTP_PASSWORD}
    - SMTP_DOMAIN=${SMTP_DOMAIN}
    - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
    - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO:-true}
    - ACTIVE_STORAGE_SERVICE=${ACTIVE_STORAGE_SERVICE:-local}
    - ENABLE_ACCOUNT_SIGNUP=${ENABLE_ACCOUNT_SIGNUP:-false}
    - FORCE_SSL=${FORCE_SSL:-false}

services:
  rails:
    <<: *base-config
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base-config
    depends_on:
      - postgres
      - redis
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot_production}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chatwoot-storage:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true

